services:
  - type: web
    name: importa-bolle-automatico
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERVALLO_MINUTI
        value: "20"
      - key: GIORNI_INDIETRO
        value: "14"
      - key: MAX_TENTATIVI
        value: "15"
    healthCheckPath: /health
